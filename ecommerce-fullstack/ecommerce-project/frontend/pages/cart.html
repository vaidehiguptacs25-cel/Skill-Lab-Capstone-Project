<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - ShopEasy</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body data-root="../">
  <div id="site-header"></div>

  <main class="container">
    <h1>Your Cart</h1>

    <div class="two-col">
      <div class="panel" id="cartItems">
        <p class="empty">Loading...</p>
      </div>

      <aside class="panel" id="summary">
        <div id="totals"></div>
        <br>
        <button class="btn btn-primary" id="checkoutBtn">Proceed to Checkout</button>
        <a class="btn btn-secondary" href="products.html">Continue shopping</a>
      </aside>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/cart.js"></script>
</body>
</html>
