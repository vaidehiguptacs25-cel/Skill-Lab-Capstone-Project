<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - ShopEasy</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body data-root="../">
  <div id="site-header"></div>

  <main class="container">
    <section class="auth-box panel">
      <h1>Register</h1>

      <form id="registerForm" novalidate>
        <div class="field">
          <label for="name">Full name</label>
          <input id="name" name="name" type="text" data-rules="required">
          <span class="error" role="alert"></span>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" data-rules="required email">
          <span class="error" role="alert"></span>
        </div>

        <div class="field">
          <label for="phone">Phone</label>
          <input id="phone" name="phone" type="tel" data-rules="required phone">
          <span class="error" role="alert"></span>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" data-rules="required password">
          <button type="button" class="btn btn-secondary" data-toggle="password" aria-label="Show or hide password">Show</button>
          <span class="error" role="alert"></span>
        </div>

        <div class="field">
          <label for="confirm">Confirm password</label>
          <input id="confirm" name="confirm" type="password" data-rules="required match:password">
          <span class="error" role="alert"></span>
        </div>

        <div class="field">
          <label for="role">I am a</label>
          <select id="role" name="role" data-rules="required">
            <option value="customer">Customer</option>
            <option value="seller">Seller</option>
          </select>
          <span class="error" role="alert"></span>
        </div>

        <button type="submit" class="btn btn-primary">Create account</button>
      </form>

      <p>Have an account? <a href="login.html">Login</a></p>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
