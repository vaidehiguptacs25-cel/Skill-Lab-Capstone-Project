<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - ShopEasy</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body data-root="../">
  <div id="site-header"></div>

  <main class="container">
    <h1>Seller Dashboard</h1>

    <div class="cards" id="stats"></div>

    <section>
      <h2>Products</h2>
      <button class="btn btn-primary" id="addBtn">Add product</button>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Category</th>
              <th>Price</th>
              <th>Stock</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="productRows"></tbody>
        </table>
      </div>
    </section>

    <section>
      <h2>Orders</h2>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Order</th>
              <th>Total</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="orderRows"></tbody>
        </table>
      </div>
    </section>

    <!-- Product Modal -->
    <div class="modal" id="productModal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-box">
        <h2 id="modalTitle">Add Product</h2>

        <form id="productForm" novalidate>
          <input type="hidden" name="id">

          <div class="field">
            <label for="name">Product name</label>
            <input id="name" name="name" type="text" data-rules="required">
            <span class="error" role="alert"></span>
          </div>

          <div class="field">
            <label for="price">Price (₹)</label>
            <input id="price" name="price" type="number" data-rules="required price">
            <span class="error" role="alert"></span>
          </div>

          <div class="field">
            <label for="discountPrice">Discount price (optional)</label>
            <input id="discountPrice" name="discountPrice" type="number" data-rules="price">
            <span class="error" role="alert"></span>
          </div>

          <div class="field">
            <label for="pCategory">Category</label>
            <select id="pCategory" name="category" data-rules="required"></select>
            <span class="error" role="alert"></span>
          </div>

          <div class="field">
            <label for="stock">Stock</label>
            <input id="stock" name="stock" type="number" data-rules="required stock">
            <span class="error" role="alert"></span>
          </div>

          <div class="field">
            <label for="image">Image URL (optional)</label>
            <input id="image" name="image" type="text" data-rules="">
            <span class="error" role="alert"></span>
          </div>

          <div class="field">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3" data-rules="required"></textarea>
            <span class="error" role="alert"></span>
          </div>

          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
        </form>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
