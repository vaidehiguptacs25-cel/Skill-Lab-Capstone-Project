<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - ShopEasy</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body data-root="">
  <div id="site-header"></div>

  <main class="container">
    <section class="hero">
      <h1>Everything you need, delivered.</h1>
      <p>Shop electronics, fashion, books and more.</p>
      <br>
      <a class="btn btn-primary" href="pages/products.html">Shop now</a>
    </section>

    <section>
      <h2>Shop by category</h2>
      <div class="grid" id="categoryCards"></div>
    </section>

    <section>
      <h2>Featured Products</h2>
      <div class="grid" id="featured"></div>
    </section>

    <section>
      <h2>New Arrivals</h2>
      <div class="grid" id="arrivals"></div>
    </section>

    <section class="promo">
      <div class="panel">🚚 Free delivery above ₹500</div>
      <div class="panel">↩️ Easy returns</div>
      <div class="panel">🔒 Secure payment</div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
